services:
  backend:
    build:
      context: ./backend/go
    volumes:
      - ./backend/go:/app
    ports:
      - "8080:8080"
    environment:
      - JWT_KEY=secret
    command: ["/go/bin/air"]

  ui-web:
    build:
      context: ./frontend/svelte
    volumes:
      - ./frontend/svelte:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
