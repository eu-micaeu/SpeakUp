services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend/go
    env_file:
      - ./backend/go/.env
    volumes:
      - ./backend/go:/app
    ports:
      - "8082:8082"
    depends_on:
      - ollama
    command: ["/go/bin/air"]

  frontend:
    build:
      context: ./frontend/svelte
    volumes:
      - ./frontend/svelte:/app
      - /app/node_modules
    ports:
      - "5175:5175"
    depends_on:
      - backend

volumes:
  ollama_data: