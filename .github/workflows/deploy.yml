name: CD - Deploy Automation

on:
  workflow_run:
    workflows: ["CI - Test Automation"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Local Server
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted

    steps:
      - name: Clean up root-owned files via Docker
        run: |
          if [ -d "./backend/go/tmp" ] || [ -d "./frontend/svelte/.svelte-kit" ]; then
            echo "🧹 Limpando arquivos temporários do root usando Docker..."
            docker run --rm -v "$(pwd)":/workspace alpine rm -rf /workspace/backend/go/tmp /workspace/frontend/svelte/.svelte-kit || true
          fi

      - name: Checkout code on self-hosted runner
        uses: actions/checkout@v4

      - name: Ensure environment file exists
        run: |
          if [ ! -f ./backend/go/.env ]; then
            echo "⚠️  backend/go/.env não encontrado no runner. Copiando de .env.example..."
            cp ./backend/go/.env.example ./backend/go/.env
          fi

      - name: Deploy Docker containers
        run: |
          echo "🚀 Atualizando repositório e reiniciando containers Docker..."
          git pull origin main
          docker compose up -d --build
          echo "✅ Deploy concluído com sucesso!"